[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuramoto-benchmark-suite"
version = "0.1.0"
description = "Benchmark-grade synthetic dataset generator for Kuramoto oscillator systems"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "eigenscribe" }
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "networkx>=3.0"
]

# ----------------------------------------------------------------------
# Explicitly define the package structure (src layout)
# ----------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]
include = ["kuramoto*"]  # Only match kuramoto packages
exclude = [
    "tests*",
    "docs*",
    "*.pyc",
    "__pycache__",
    "*.egg-info",
]

# ----------------------------------------------------------------------
# Development extras (testing, linting, notebooks)
# ----------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "ipykernel>=6.0",   # for Jupyter notebooks
]

# ----------------------------------------------------------------------
# Make `src/` the default import location for notebooks
# ----------------------------------------------------------------------
[tool.ipython]
# When you start a notebook from the repository root, IPython will add the
# project's root to sys.path automatically.  If you use VS Code's Jupyter
# extension, the same behavior applies.

# ----------------------------------------------------------------------
# Testing configuration
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]  # Ensure tests import from src/

# ----------------------------------------------------------------------
# Code formatting (Black)
# ----------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
)/
'''

# ----------------------------------------------------------------------
# Linting (Ruff)
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in init files

# ----------------------------------------------------------------------
# Package data (if you have non-Python files in packages)
# ----------------------------------------------------------------------
[tool.setuptools.package-data]
kuramoto = ["*.py", "*.txt", "*.md"]